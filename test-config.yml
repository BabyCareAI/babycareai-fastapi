config:
  target: 'http://localhost:8000'
  http:
    # Artillery 클라이언트 타임아웃은 일단 넉넉하게 유지 (서버측 에러가 아닌 클라이언트 타임아웃으로 인한 멈춤을 방지)
    timeout: 90000  # 90초

  phases:
    # 1단계: 낮은 부하로 시작
    - duration: 120
      arrivalRate: 0.05   # 초당 0.05건 = 20초에 1건
      rampTo: 0.1         # 초당 0.1건 = 10초에 1건
      name: "Phase 1: Low Load Warm-up (0.05 -> 0.1 RPS)"

    # 2단계: 낮은 부하에서 안정성 확인
    - duration: 90
      arrivalRate: 0.1
      name: "Phase 2: Sustain Low Load (0.1 RPS)"

    # 3단계: 부하를 조금씩 증가
    - duration: 90
      arrivalRate: 0.1
      rampTo: 0.2         # 초당 0.2건 = 5초에 1건
      name: "Phase 3: Gentle Ramp-up (0.1 -> 0.2 RPS)"

    # 4단계: 5초에 1건 부하 유지
    - duration: 60
      arrivalRate: 0.2
      name: "Phase 4: Sustain Moderate Load (0.2 RPS)"

    # 5단계: 부하를 조금 더 증가
    - duration: 90
      arrivalRate: 0.2
      rampTo: 0.3         # 초당 0.3건 = 3.33초에 1건
      name: "Phase 5: Moderate Ramp-up (0.2 -> 0.3 RPS)"

    # 6단계: 3.33초에 1건 부하 유지
    - duration: 90
      arrivalRate: 0.3
      name: "Phase 6: Sustain Higher Load (0.3 RPS)"

    # 7단계: 부하를 점진적으로 증가
    - duration: 90
      arrivalRate: 0.3
      rampTo: 0.4         # 초당 0.4건 = 2.5초에 1건
      name: "Phase 7: Incremental Ramp-up (0.3 -> 0.4 RPS)"

    # 8단계: 2.5초에 1건 부하 유지
    - duration: 90
      arrivalRate: 0.4
      name: "Phase 8: Sustain High Load (0.4 RPS)"

    # 9단계: 부하를 조금 더 증가
    - duration: 90
      arrivalRate: 0.4
      rampTo: 0.5         # 초당 0.5건 = 2초에 1건
      name: "Phase 9: High Ramp-up (0.4 -> 0.5 RPS)"

    # 10단계: 2초에 1건 부하 유지
    - duration: 90
      arrivalRate: 0.5
      name: "Phase 10: Sustain Critical Load (0.5 RPS)"


  payload:
    path: "diagnosis_id_72.csv"
    fields:
      - "diagnosis_id"

scenarios:
  - name: "진단 API 테스트"
    flow:
      - post:
          url: '/api/v1/diagnosis/rag'
          json:
            diagnosis_id: "{{ diagnosis_id }}"

  - name: "기타 증상 입력 API 테스트"
    flow:
      - post:
          url: '/api/v1/diagnosis/other-symptom'
          json:
            diagnosis_id: "{{ diagnosis_id }}"
            other_symptom_text: "가려움증이 심하고 붉은 반점이 있습니다."

  - name: "이미지 검증 API 테스트"
    flow:
      - post:
          url: '/api/v1/diagnosis/validate'
          json:
            diagnosis_id: "{{ diagnosis_id }}"

  - name: "이미지 상태 설명 API 테스트"
    flow:
      - post:
          url: '/api/v1/diagnosis/image-description'
          json:
            diagnosis_id: "{{ diagnosis_id }}"