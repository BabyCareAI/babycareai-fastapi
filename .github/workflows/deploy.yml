name: Deploy To EC2

on:
  push:
    branches:
      - release/37-v0.4.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 3.12.3 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: .env 파일 만들기
        env:
          ENV_FILE: ${{ secrets.FASTAPI_ENV_FILE }}
        run: |
          printf "%s" "$ENV_FILE" > .env

      - name: 의존성 설치 및 테스트
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 생성
        run: docker build -t fastapi-server .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag fastapi-server ${{ steps.login-ecr.outputs.registry }}/babycareai/fastapi-server:latest

      - name: ECR에 Docker 이미지 Push하기
        run: docker push ${{ steps.login-ecr.outputs.registry }}/babycareai/fastapi-server:latest

      - name: 압축하기
        run: tar -czvf $GITHUB_SHA.tar.gz appspec.yml scripts

      - name: S3에 프로젝트 폴더 업로드하기
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.tar.gz s3://babycareai-deploy/$GITHUB_SHA.tar.gz

      - name: Code Deploy를 활용해 EC2에 appspec.yml scripts 업로드
        run: |
          aws deploy create-deployment \
            --application-name babycareai-server \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name Production \
            --s3-location bucket=babycareai-deploy,bundleType=tgz,key=$GITHUB_SHA.tar.gz